                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/operations/{id}:cancel:
    post:
      operationId: cancelOperation
      summary: Request cancellation of an operation
      tags:
        - Operations
      x-phase: "12"
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or API token
      description: Either a short-lived (5–15 min) JWT access token issued to the BFF for a user session, or an automation API token `clt_<prefix>_<secret>` (scoped, expiring).
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-cl_session
      description: "Browser ↔ Next.js BFF session cookie (HttpOnly, Secure, SameSite=Lax). Documented for completeness: the BFF exchanges it server-side for a bearer access token; API clients must use bearerAuth. No CORS by default (same-origin BFF)."
    scimBearer:
      type: http
      scheme: bearer
      description: Per-IdP SCIM token used only on /scim/v2/* (RFC 7644; not specified in this document).
  parameters:
    TenantHeader:
      name: X-CloudLedger-Tenant
      in: header
      required: false
      description: Tenant ID for principals with access to multiple tenants. Defaults to the principal's tenant. Cross-tenant access yields 404.
      schema:
        $ref: "#/components/schemas/Id"
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (default 50, max 500).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous next_cursor.
      schema:
        type: string
        maxLength: 2048
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated documented sort fields; prefix with - for descending (e.g. -created_at).
      schema:
        type: string
        pattern: ^-?[a-z_]+(,-?[a-z_]+)*$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Recommended on all POSTs; stored 24 h per (tenant, principal, key). Same key + different body → 409 idempotency_key_reuse.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: REQUIRED for financial operations (period close, report run, invoice import).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from a previous read (W/"<version>"). Mismatch → 412.
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    WidgetId:
      name: widget_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    VarianceId:
      name: variance_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    TemplateKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        examples:
          - aws
          - gcp
          - azure
    BillingPeriodPath:
      name: period
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BillingPeriod"
    From:
      name: from
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Timestamp"
    To:
      name: to
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Timestamp"
  headers:
    ETag:
      description: Weak entity tag W/"<version>".
      schema:
        type: string
        examples:
          - W/"7"
    Location:
      description: URL of the created resource.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    RateLimitLimit:
      description: "IETF RateLimit header draft: quota for the current window (bucket: query, ai, export or default)."
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining quota in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the quota resets.
      schema:
        type: integer
    IdempotentReplayed:
      description: true when the response is a stored replay for the same Idempotency-Key.
      schema:
        type: string
        enum:
          - "true"
    RequestId:
      description: Request correlation id (also in Problem.request_id).
      schema:
        type: string
    Deprecation:
      description: Deprecation header (RFC 9745) on deprecated endpoints.
      schema:
        type: string
    Sunset:
      description: Sunset header (RFC 8594) on deprecated endpoints.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request (e.g. code=bad_request, malformed_json).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid credentials (e.g. code=unauthenticated, token_expired).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not permitted; only when the resource's existence is already known to the caller (e.g. code=forbidden).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found. Also returned for cross-tenant access (no existence oracle) (e.g. code=not_found).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: State conflict (e.g. code=conflict, idempotency_key_reuse, period_closed, invalid_transition).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: If-Match did not match the current ETag (e.g. code=precondition_failed).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Payload too large (e.g. code=payload_too_large).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed (e.g. code=validation_failed, unsupported_query).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limited (e.g. code=rate_limited, query_budget_exceeded).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal error; no stack traces, only request_id (e.g. code=internal).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Temporarily unavailable (e.g. code=unavailable, analytics_unavailable).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Accepted:
      description: Accepted; a long-running Operation was started.
      headers:
        Location:
          $ref: "#/components/headers/Location"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"
    NoContent:
      description: No content.
  schemas:
    Id:
      type: string
      description: Opaque identifier (UUIDv7 for entities; prefixed ids such as op_… for operations). Clients must not parse IDs.
      minLength: 1
      maxLength: 64
      examples:
        - 0193a4f2-7c1e-7b3a-9d2e-5f1c2b3a4d5e
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC (Z suffix).
      examples:
        - 2026-11-15T00:00:00Z
    Date:
      type: string
      format: date
      description: Calendar date YYYY-MM-DD.
      examples:
        - 2026-11-15
    BillingPeriod:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
      description: Billing month YYYY-MM.
      examples:
        - 2026-10
    Decimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,25})(\.[0-9]{1,12})?$
      description: Fixed-point decimal as a string (numeric(38,12), ADR-0007). Never a JSON number; clients must not parse into floats.
      examples:
        - "1234.567800000000"
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      description: ISO 4217 alphabetic currency code.
      examples:
        - USD
    Money:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Decimal"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
      required:
        - amount
        - currency
      additionalProperties: false
      description: Monetary amount. amount is ALWAYS a decimal string, never a number.
      examples:
        - amount: "1234.567800000000"
          currency: USD
    Ratio:
      type: string
      pattern: ^(0(\.[0-9]{1,12})?|1(\.0{1,12})?)$
      description: Decimal ratio in [0,1] as a string.
    Labels:
      type: object
      additionalProperties:
        type: string
      description: String key/value map (tags, labels).
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          default: about:blank
          examples:
            - https://docs.cloudledger.dev/errors/validation
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Stable machine-readable error code (lower_snake_case), e.g. validation_failed, period_closed, idempotency_key_reuse.
        detail:
          type: string
        instance:
          type: string
          description: Request path.
        request_id:
          type: string
          description: Correlates with server logs and traces. No stack traces are ever returned.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemFieldError"
      required:
        - type
        - title
        - status
        - code
        - request_id
      description: RFC 9457 Problem Details plus CloudLedger extensions (code, request_id, errors). The docs domain is a placeholder pending OQ-01.
    ProblemFieldError:
      type: object
      properties:
        pointer:
          type: string
          description: RFC 6901 JSON Pointer into the request body.
        parameter:
          type: string
          description: Query/header parameter name, when the error is not in the body.
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    CursorPage:
      type: object
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          oneOf:
            - type: string
              description: Opaque, HMAC-signed cursor bound to tenant and filters.
            - type: "null"
      required:
        - data
        - next_cursor
      description: Cursor pagination envelope. List responses specialise `data`.
    ResourceLink:
      type: object
      properties:
        type:
          type: string
        id:
          $ref: "#/components/schemas/Id"
        href:
          type: string
      required:
        - type
        - id
    Operation:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
          readOnly: true
        kind:
          type: string
          enum:
            - connector_verify
            - connector_sync
            - connector_backfill
            - import
            - reallocation
            - report_run
            - export
            - period_close
            - period_reopen
            - reconciliation
            - invoice_import
            - tenant_deletion
            - audit_verify
            - forecast
          description: "Open enum: clients must tolerate unknown values."
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        progress:
          type: number
          minimum: 0
          maximum: 1
        result_ref:
          oneOf:
            - $ref: "#/components/schemas/ResourceLink"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        links:
          type: object
          properties:
            self:
              type: string
          required:
            - self
      required:
        - id
        - kind
        - status
        - links
      description: Long-running operation (API_GUIDELINES §9). Poll GET /api/v1/operations/{id} or subscribe to webhooks.
    AnalyticsMeta:
      type: object
      properties:
        data_version:
          type: integer
        completeness:
          type: number
          minimum: 0
          maximum: 1
        query_id:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        fx_rate_set_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        freshness:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              connector_id:
                $ref: "#/components/schemas/Id"
              latest_charge_period_end:
                $ref: "#/components/schemas/Timestamp"
              lag_hours:
                type: number
            required:
              - provider
              - connector_id
      required:
        - data_version
        - freshness
        - query_id
      description: Freshness metadata included on every analytics response (API_GUIDELINES §12).
    FilterExpression:
      $ref: ../../schemas/semantic/query.v1.json#/$defs/filter
    SemanticQuery:
      $ref: ../../schemas/semantic/query.v1.json
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unavailable
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum:
                  - ok
                  - degraded
                  - unavailable
              detail:
                type: string
      required:
        - status
    VersionInfo:
      type: object
      properties:
        version:
          type: string
          examples:
            - 0.1.0
        commit:
          type: string
        build_date:
          $ref: "#/components/schemas/Timestamp"
        api_version:
          type: string
          examples:
            - v1
        focus_version:
          type: string
          examples:
            - "1.2"
        analytics_engine:
          type: string
          enum:
            - postgres
            - duckdb
            - clickhouse
        deployment_profile:
          type: string
        license:
          type: object
          properties:
            name:
              type: string
            spdx:
              type: string
          required:
            - name
            - spdx
          description: Informational only; no runtime license enforcement (NFR-LIC-004).
      required:
        - version
        - api_version
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
          readOnly: true
        email:
          type: string
          format: email
        display_name:
          oneOf:
            - type: string
            - type: "null"
        status:
          type: string
          enum:
            - active
            - disabled
        is_platform_admin:
          type: boolean
          readOnly: true
      required:
        - id
        - email
        - status
    TenantSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        slug:
          type: string
        display_name:
          type: string
        role_keys:
          type: array
          items:
            type: string
      required:
        - id
        - slug
        - display_name
    Me:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          oneOf:
            - $ref: "#/components/schemas/TenantSummary"
            - type: "null"
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantSummary"
        permissions:
          type: array
          items:
            type: string
          description: Effective permissions in the current tenant.
        data_scope_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        session_expires_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      required:
        - user
        - tenants
        - permissions
    Session:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
          readOnly: true
        tenant_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        current:
          type: boolean
        created_at:
          $ref: "#/components/schemas/Timestamp"
        idle_expires_at:
          $ref: "#/components/schemas/Timestamp"
        absolute_expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        user_agent:
          oneOf:
            - type: string
            - type: "null"
        ip:
          oneOf:
            - type: string
            - type: "null"
      required:
        - id
        - created_at
        - idle_expires_at
        - absolute_expires_at
    Tenant:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
          readOnly: true
        created_at:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        updated_at:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        version:
          type: integer
          description: Optimistic-concurrency version; exposed as ETag W/"<version>".
          readOnly: true
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
        display_name:
          type: string
          maxLength: 200
        kind:
          type: string
          enum:
            - individual
            - organization
        parent_tenant_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        status:
          type: string
          enum:
            - provisioning
            - active
            - suspended
            - pending_deletion
            - deleted
          readOnly: true
        data_region:
          oneOf:
            - type: string
            - type: "null"
      required:
        - id
        - slug
        - display_name
        - kind
        - status
    TenantInput:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
        display_name:
          type: string
          maxLength: 200
        kind:
          type: string
          enum:
            - individual
            - organization
        parent_tenant_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        data_region:
          oneOf:
            - type: string
            - type: "null"
      required:
        - slug
        - display_name
        - kind
      additionalProperties: false
    TenantCreate:
      allOf:
        - $ref: "#/components/schemas/TenantInput"
        - type: object
          properties:
            initial_admin_email:
              type: string
              format: email
          required:
            - initial_admin_email
    TenantAdminPatch:
      type: object
      properties:
        display_name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        data_region:
          oneOf:
            - type: string
            - type: "null"
      additionalProperties: false
      minProperties: 1
    TenantSettings:
      type: object
      properties:
        reporting_currency:
          $ref: "#/components/schemas/CurrencyCode"
        fx_policy:
          type: string
          enum:
            - charge_date
            - month_end
            - month_average
            - provider
        accounting_calendar:
          type: object
          properties:
            type:
              type: string
              enum:
                - gregorian
                - 4-4-5
                - 4-5-4
                - 5-4-4
            fiscal_year_start_month:
              type: integer
              minimum: 1
              maximum: 12
          required:
            - type
        timezone:
          type: string
          description: IANA time zone for presentation only; storage and queries are UTC.
        retention:
          type: object
          properties:
            raw_months:
              type: integer
            cost_months:
              type: integer
            ai_conversation_days:
              type: integer
            audit_years:
              type: integer
            closed_period_years:
              type: integer
        ai_settings:
          type: object
          properties:
            enabled:
              type: boolean
            model_ref:
              oneOf:
                - type: string
                - type: "null"
            allow_external_providers:
              type: boolean
            max_rows_per_tool_call:
              type: integer
              maximum: 1000
          required:
            - enabled
        updated_at:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        version:
          type: integer
          readOnly: true
      required:
        - reporting_currency
        - fx_policy
        - accounting_calendar
        - timezone
    TenantSettingsPatch:
      type: object
      properties:
        reporting_currency:
          $ref: "#/components/schemas/CurrencyCode"
        fx_policy:
          type: string
          enum:
            - charge_date
            - month_end
            - month_average
            - provider
        accounting_calendar:
          type: object
          properties:
            type:
              type: string
              enum:
                - gregorian
                - 4-4-5
                - 4-5-4
                - 5-4-4
            fiscal_year_start_month:
              type: integer
              minimum: 1
              maximum: 12
          required:
            - type
        timezone:
          type: string
          description: IANA time zone for presentation only; storage and queries are UTC.
        retention:
          type: object
          properties:
            raw_months:
              type: integer
            cost_months:
              type: integer
            ai_conversation_days:
