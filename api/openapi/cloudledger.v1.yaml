# CloudLedger API — OpenAPI 3.1 contract (DRAFT, version 0.0.0-draft)
# Source of truth for the REST API (ADR-0011). Conventions: docs/contracts/API_GUIDELINES.md.
# Licensing: proposed CloudLedger Source-Available License 1.0 (LicenseRef-CloudLedger-SAL-1.0);
# OQ-22 Option A would relicense api/openapi/ under Apache-2.0. See docs/legal/LICENSE_MAP.md.
# CloudLedger is source-available, not open source.
openapi: 3.1.0
info:
  title: CloudLedger API
  version: 0.0.0-draft
  summary: REST API for CloudLedger, a source-available multi-cloud FinOps platform.
  description: |-
    **DRAFT.** No implementation exists yet. This contract is refined phase by phase; every operation carries `x-phase` (the delivery phase from docs/phases).

    Conventions are defined in docs/contracts/API_GUIDELINES.md and are authoritative: base path `/api/v1`, snake_case JSON, UUIDv7 opaque IDs, RFC 3339 UTC timestamps,
    **money as `{amount: "<decimal string>", currency: "<ISO 4217>"}` (never a JSON number)**, RFC 9457 problem details, cursor pagination, `Idempotency-Key` on POST,
    `ETag`/`If-Match` optimistic concurrency, IETF RateLimit headers and `202 Accepted` + Operation for long-running work.

    The semantic query schema is shared with `schemas/semantic/query.v1.json` and plugin manifests with `schemas/manifest/plugin-manifest.v1.json` (resolved via relative `$ref`; bundle before codegen).

    SCIM 2.0 (`/scim/v2/Users`, `/scim/v2/Groups`, Phase 31) follows RFC 7644 and is not re-specified here.

    **Licensing:** CloudLedger is source-available (not open source). This specification is currently marked with the proposed CloudLedger Source-Available License 1.0.
    Per OQ-22 / docs/legal/LICENSE_MAP.md, Option A (recommended, pending legal review) would license `api/openapi/` under Apache-2.0 to enable independently written clients; Option B keeps CL-SAL-1.0.
    The `docs.cloudledger.dev` and `dev.cloudledger` names are placeholders pending OQ-01.
  license:
    name: CloudLedger Source-Available License 1.0 (proposed draft)
    identifier: LicenseRef-CloudLedger-SAL-1.0
servers:
  - url: https://cloudledger.example.invalid
    description: Placeholder. Paths include the /api/v1 prefix; /healthz and /readyz are at the root.
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness, readiness and version (unauthenticated).
  - name: Auth
    description: Current principal and sessions.
  - name: Tenants (admin)
    description: Platform-admin tenant management.
  - name: Settings
    description: Tenant settings.
  - name: Access
    description: Members, roles, data scopes (ABAC), role bindings and API tokens.
  - name: SCIM
    description: SCIM 2.0 provisioning (Phase 31) is served at `/scim/v2/Users` and `/scim/v2/Groups` and follows RFC 7643/7644. It uses a per-IdP SCIM bearer token (securityScheme `scimBearer`) and is intentionally not re-specified here.
    externalDocs:
      url: https://www.rfc-editor.org/rfc/rfc7644
      description: RFC 7644 SCIM Protocol
  - name: Hierarchy
    description: Versioned business hierarchy (cost centers, teams…).
  - name: Connectors
    description: Cloud provider connectors, verification, sync, backfill, health and scopes.
  - name: Imports
    description: Generic file imports and column mappings.
  - name: Ingestion
    description: Ingestion runs and restatement diffs.
  - name: Query
    description: Semantic analytics query and catalog.
  - name: Dashboards
    description: Dashboards, widgets, saved views and templates.
  - name: Allocation
    description: Allocation rule sets and custom dimensions.
  - name: Budgets & anomalies
    description: Budgets, forecasts and anomalies.
  - name: Alerts
    description: Alert channels and notification deliveries.
  - name: Finance
    description: FX, commitments, unit metrics, invoices, reconciliation and period close.
  - name: Reports
    description: Report definitions, runs and exports.
  - name: Inventory
    description: Resource inventory and utilization metrics.
  - name: Recommendations
    description: Evidence-backed recommendations and realized savings.
  - name: AI
    description: Governed AI assistant (tool-only data access).
  - name: Audit
    description: Hash-chained audit log.
  - name: Plugins (admin)
    description: Installed plugins and their manifests.
  - name: Operations
    description: Long-running operations.
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      tags:
        - Health
      x-phase: "03"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security: []
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe (DB, queue, analytics engine)
      tags:
        - Health
      x-phase: "03"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
